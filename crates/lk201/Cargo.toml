[package]
name = "lk201"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "LK201 keyboard protocol implementation"
authors = ["Matt Mastracci <matthew@mastracci.com>"]
repository = "https://github.com/mmastrac/blaze"
readme = "README.md"

[dependencies]
tracing = "0.1.41"
i8051 = { version = "0.13.0", optional = true }

[dev-dependencies]
tracing = "0.1.41"
tracing-subscriber = "0.3.20"

[features]
default = []
hardware = ["dep:i8051"]
