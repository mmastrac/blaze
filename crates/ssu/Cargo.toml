[package]
name = "ssu"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0"
description = "SSU protocol implementation"
authors = ["Matt Mastracci <matthew@mastracci.com>"]
repository = "https://github.com/mmastrac/blaze-vt"

[dependencies]
tracing = "0.1"
tracing-subscriber = "0.3"

# features=pty
pty-process = { version = "0.5", optional = true }

clap = { version = "4.5", features = ["derive"], optional = true }
crossterm = { version = "0.29", optional = true }
shellish_parse = { version = "2", optional = true }

[features]
default = []
session-config = ["dep:clap", "dep:shellish_parse"]
server = ["dep:clap", "dep:crossterm", "session-config"]
pty = ["dep:pty-process"]

[[bin]]
name = "server"
path = "bin/server.rs"
required-features = ["pty", "server"]
