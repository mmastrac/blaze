[package]
name = "ssu"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0"
description = "SSU protocol implementation"
authors = ["Matt Mastracci <matthew@mastracci.com>"]
repository = "https://github.com/mmastrac/blaze"

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
atomic-waker = "1.1"

# features=pty
pty-process = { version = "0.5", optional = true }

clap = { version = "4.5", features = ["derive"], optional = true }
shellish_parse = { version = "2", optional = true }

raw_tty = { version = "0.1", optional = true }

pollster = { version = "0", optional = true }
tokio = { version = "1", features = ["full"], optional = true }

serialport = { version = "4", optional = true }

wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3.82", features = [], optional = true }


[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[features]
default = []
std-io = []
session-config = ["dep:clap", "dep:shellish_parse"]
server = ["dep:clap", "dep:raw_tty", "dep:tokio", "session-config"]
pty = ["dep:pty-process", "std-io"]
serial = ["dep:serialport", "std-io"]
wasm = ["dep:wasm-bindgen", "dep:js-sys"]

[[bin]]
name = "server"
path = "bin/server.rs"
required-features = ["pty", "server"]
