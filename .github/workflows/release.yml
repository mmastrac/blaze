name: Release binaries

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_DEBUG: "false"
  CARGO_PROFILE_RELEASE_STRIP: "true"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show && rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --bin blaze-vt --features embed-rom --target ${{ matrix.target }}
      - name: Package
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$GITHUB_REF_NAME
          elif [ -n "$PR_NUMBER" ]; then
            version=pr$PR_NUMBER-${HEAD_SHA::7}
          else
            version=${HEAD_SHA::7}
          fi
          name=blaze-vt-$version-${{ matrix.target }}
          mkdir -p dist/$name
          cp target/${{ matrix.target }}/release/blaze-vt dist/$name/
          cp README.md LICENSE.md AGPL-3.0.txt dist/$name/
          tar -C dist -czf dist/$name.tar.gz $name
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum $name.tar.gz > $name.tar.gz.sha256
          else
            shasum -a 256 $name.tar.gz > $name.tar.gz.sha256
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: blaze-vt-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
